[project]
name = "rocm-docs-agent"
version = "0.1.0"
description = "Agentic RAG assistant that answers AMD ROCm developer questions from the official docs, with citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "pypandoc_binary>=1.13",
    "docling>=2.150,<3",  # chunking (HybridChunker); pulls torch, install the CPU build first
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
rocm-agent = "rocm_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocm_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
